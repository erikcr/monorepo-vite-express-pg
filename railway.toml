[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["artifacts/api-server/**", "lib/**", "Dockerfile", "package.json", "pnpm-workspace.yaml"]

[deploy]
preDeployCommand = "node dist/migrate.js"
startCommand = "node dist/index.js"
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
# Time between SIGTERM and SIGKILL on redeploy; the server's shutdown timeout (25s) stays below it.
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
