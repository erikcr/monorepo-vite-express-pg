openapi: "3.1.0"
info:
  title: Monorepo API
  version: "1.0.0"
  description: Template API

servers:
  - url: http://localhost:3000
    description: Local

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check (always 200 while the process is up)
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/ready:
    get:
      operationId: getReady
      summary: Readiness check (503 when the database is unreachable)
      tags: [system]
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/client-errors:
    post:
      operationId: reportClientError
      summary: Record a crash or unhandled error from a browser app
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/example:
    get:
      operationId: listExamples
      summary: List example records, newest first, one page at a time
      tags: [example]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The nextCursor from the previous page; omit for the first page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamplePage"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      operationId: createExample
      summary: Create an example record
      tags: [example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/example/{id}:
    parameters:
      - $ref: "#/components/parameters/ExampleId"
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getExample
      summary: Get one example record
      tags: [example]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateExample
      summary: Update an example record
      tags: [example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExampleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteExample
      summary: Delete an example record
      tags: [example]
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    OrgId:
      name: orgId
      in: query
      required: true
      description: Tenant the records belong to (moves to the authenticated session with auth)
      schema:
        type: string
        minLength: 1
    ExampleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such record in this org
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          description: A message, or field-level validation errors

    ClientErrorReport:
      type: object
      required: [app, message]
      properties:
        app:
          description: Which frontend sent it
          type: string
          enum: [web, admin]
        message:
          type: string
          minLength: 1
          maxLength: 2000
        stack:
          type: string
          maxLength: 10000
        componentStack:
          type: string
          maxLength: 10000
        url:
          description: Page the error happened on (the server drops any query string)
          type: string
          maxLength: 2000

    ExamplePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Example"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type: [string, "null"]

    HealthResponse:
      type: object
      required: [status, ts, db, sha]
      properties:
        status:
          type: string
          enum: [ok]
        ts:
          type: string
          format: date-time
        db:
          type: string
          enum: [ok, error]
        sha:
          description: Deployed git commit, or null when not running on Railway
          type: [string, "null"]

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [db]
          properties:
            db:
              type: string
              enum: [ok, error]

    Example:
      type: object
      required: [id, orgId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExampleInput:
      type: object
      required: [orgId, name]
      properties:
        orgId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    UpdateExampleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
