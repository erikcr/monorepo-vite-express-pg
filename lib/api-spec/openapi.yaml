openapi: "3.1.0"
info:
  title: Monorepo API
  version: "1.0.0"
  description: |
    Template API.

    **Authentication:** send the Clerk session token as `Authorization: Bearer <token>` (operations
    marked public need none).

    **Organization:** org-scoped operations act in the org named by the `X-Org-Id` header, which
    the server checks against your memberships (403 if you don't belong to it). If you belong to
    exactly one org it may be omitted; with several, omitting it answers 400 `org_required`.

security:
  - bearerAuth: []

servers:
  - url: http://localhost:3000
    description: Local

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check (always 200 while the process is up)
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/ready:
    get:
      operationId: getReady
      security: []
      summary: Readiness check (503 when the database is unreachable)
      tags: [system]
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/client-errors:
    post:
      operationId: reportClientError
      security: []
      summary: Record a crash or unhandled error from a browser app
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/me:
    get:
      operationId: getMe
      summary: The signed-in person and the orgs they belong to
      tags: [account]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orgs:
    post:
      operationId: createOrg
      summary: Create an org; the creator becomes its org_admin
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The handle is taken (`code` is handle_taken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orgs/handle-available:
    get:
      operationId: checkOrgHandle
      summary: Whether a handle can be chosen for a new org, for checking it as it's typed
      description: |
        Answers for the handle lowercased, as creating the org would. A handle that breaks the
        rules is `invalid` here rather than a 400, so the form can say why.
      tags: [account]
      parameters:
        - name: handle
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orgs/current:
    delete:
      operationId: deleteCurrentOrg
      summary: Delete the org (X-Org-Id) and everything in it, for good
      description: |
        Only an org_admin may. The body repeats the org's name, so a stale or mistaken request
        can't delete the wrong org.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrgInput"
      responses:
        "204":
          description: Deleted, with its memberships and records
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orgs/current/membership:
    delete:
      operationId: leaveCurrentOrg
      summary: Leave the org (X-Org-Id)
      description: Any member may, except its last org_admin (409 `last_org_admin`).
      tags: [account]
      responses:
        "204":
          description: Left
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/orgs/current/members:
    get:
      operationId: listOrgMembers
      summary: The org's members (X-Org-Id), newest first, one page at a time
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orgs/current/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/MemberUserId"
    patch:
      operationId: updateOrgMember
      summary: Change a member's role (org admins)
      description: Never demotes the org's last org_admin (409 `last_org_admin`).
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgMemberInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: removeOrgMember
      summary: Remove a member from the org (org admins)
      description: Never removes the org's last org_admin (409 `last_org_admin`).
      tags: [members]
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/orgs/current/invitations:
    get:
      operationId: listInvitations
      summary: The org's pending invitations (X-Org-Id), newest first, one page at a time
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createInvitation
      summary: Invite someone by email (org admins)
      description: |
        Emails them a link that's valid for 7 days. Replaces a pending invitation for the same
        email (its link stops working). 409 `already_member` if they already belong to the org.
        Each person may send at most 50 invitations a day, across all their orgs: past that, 429
        `invitation_limit`.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/orgs/current/invitations/{id}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation (org admins); its link stops working
      tags: [members]
      responses:
        "204":
          description: Revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Join an org with an invitation's token
      description: |
        The signed-in person's primary email, verified and as the identity provider has it now,
        must be the one invited (403 `invitation_email_mismatch`; 403 `email_unverified` if it no
        longer is verified). An unknown, used or revoked token is 404
        `invitation_not_found`; an expired one 410 `invitation_expired`.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "200":
          description: Joined (or already a member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The invitation has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/orgs:
    get:
      operationId: listAdminOrgs
      summary: Every org, newest first (staff)
      tags: [admin]
      parameters:
        - name: q
          in: query
          required: false
          description: Only orgs whose name contains this (case-insensitive)
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The nextCursor from the previous page; omit for the first page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrgPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/example:
    get:
      operationId: listExamples
      summary: List example records, newest first, one page at a time
      tags: [example]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The nextCursor from the previous page; omit for the first page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamplePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createExample
      summary: Create an example record
      tags: [example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/example/{id}:
    parameters:
      - $ref: "#/components/parameters/ExampleId"
    get:
      operationId: getExample
      summary: Get one example record
      tags: [example]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateExample
      summary: Update an example record
      tags: [example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExampleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteExample
      summary: Delete an example record
      tags: [example]
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clerk session token

  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor from the previous page; omit for the first page
      schema:
        type: string
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExampleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not signed in (missing, invalid or expired session token)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Signed in, but no access (not a member of that org, or lacking the permission)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No such record in this org
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Not possible in the current state (the `code` says why)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Over a limit (the `code` says which); try again later
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          description: A message, or field-level validation errors
        code:
          description: Machine-readable reason, e.g. org_required, forbidden, no_org
          type: string

    ClientErrorReport:
      type: object
      required: [app, message]
      properties:
        app:
          description: Which frontend sent it
          type: string
          enum: [web, admin]
        message:
          type: string
          minLength: 1
          maxLength: 2000
        stack:
          type: string
          maxLength: 10000
        componentStack:
          type: string
          maxLength: 10000
        url:
          description: Page the error happened on (the server drops any query string)
          type: string
          maxLength: 2000

    OrgRole:
      type: string
      enum: [org_admin, org_member]

    OrgMembership:
      type: object
      required: [id, name, handle, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          description: The org's address in the web app, /o/<handle>. Fixed once chosen.
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"

    OrgMember:
      type: object
      required: [userId, email, name, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        joinedAt:
          type: string
          format: date-time

    OrgMemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgMember"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type: [string, "null"]

    UpdateOrgMemberInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    Invitation:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        expiresAt:
          description: After this the link no longer works; invite again to send a new one
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InvitationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type: [string, "null"]

    CreateInvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/OrgRole"

    AcceptInvitationInput:
      type: object
      required: [token]
      properties:
        token:
          description: The token from the invitation link
          type: string
          minLength: 1
          maxLength: 200

    Me:
      type: object
      required: [user, orgs]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
        orgs:
          description: Every org the person belongs to; send one's id as X-Org-Id
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"

    CreateOrgInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        handle:
          description: |
            The org's address, /o/<handle>: 3–40 lowercase letters, digits and single hyphens,
            with no hyphen at either end, and not a reserved word. Taken lowercased. Without one,
            the API makes one from the name.
          type: string
          maxLength: 100

    HandleAvailability:
      type: object
      required: [handle, available]
      properties:
        handle:
          description: The handle checked, lowercased
          type: string
        available:
          type: boolean
        reason:
          description: Why it's not available
          type: string
          enum: [invalid, reserved, taken]

    DeleteOrgInput:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          description: The org's name, exactly as it is
          type: string
          maxLength: 100

    AdminOrg:
      type: object
      required: [id, name, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminOrgPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrg"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type: [string, "null"]

    ExamplePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Example"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type: [string, "null"]

    HealthResponse:
      type: object
      required: [status, ts, db, sha]
      properties:
        status:
          type: string
          enum: [ok]
        ts:
          type: string
          format: date-time
        db:
          type: string
          enum: [ok, error]
        sha:
          description: Deployed git commit, or null when not running on Railway
          type: [string, "null"]

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [db]
          properties:
            db:
              type: string
              enum: [ok, error]

    Example:
      type: object
      required: [id, orgId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExampleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    UpdateExampleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
