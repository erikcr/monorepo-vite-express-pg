packages:
  - 'artifacts/*'
  - 'lib/*'

# Supply-chain security: ignore packages published less than 24h ago
minimumReleaseAge: 1440

# Supply-chain security: only these packages may run install scripts
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  better-sqlite3: true
  sharp: true

catalog:
  # React ecosystem
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.8
  "@types/react-dom": ^19.0.3
  "@tanstack/react-query": ^5.64.2
  # Vite + Tailwind
  vite: ^8.3.0
  "@vitejs/plugin-react": ^6.1.0
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  # Database
  drizzle-orm: ^0.38.3
  # Validation
  zod: ^3.24.1
  # TypeScript / build tooling
  typescript: ^5.7.3
  tsx: ^4.19.2
  "@types/node": ^24.0.0
  # Testing
  vitest: ^5.0.0
  jsdom: ^30.1.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  # Misc
  dotenv: ^16.4.7
