packages:
  - 'artifacts/*'
  - 'lib/*'

# Supply-chain security: ignore packages published less than 24h ago
minimumReleaseAge: 1440

# Supply-chain security: only these packages may run install scripts
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  better-sqlite3: true
  sharp: true

catalog:
  # React ecosystem
  # Pinned exactly; always bump react and react-dom together.
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@tanstack/react-query": ^5.104.0
  "@tanstack/react-router": ^1.170.0
  # Vite + Tailwind
  vite: ^8.3.0
  "@vitejs/plugin-react": ^6.1.0
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  # Database
  drizzle-orm: ^0.45.4
  # Validation
  zod: ^4.6.0
  # TypeScript / build tooling
  typescript: ^7.0.2
  tsx: ^4.23.15
  "@types/node": ^24.0.0
  # Testing
  vitest: ^5.0.0
  "@vitest/coverage-v8": ^5.0.0
  jsdom: ^30.1.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3

overrides:
  # Security: drizzle-kit's deprecated @esbuild-kit loader pins a vulnerable esbuild (<=0.24).
  "@esbuild-kit/core-utils>esbuild": ^0.28.1
