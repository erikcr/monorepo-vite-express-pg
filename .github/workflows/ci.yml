name: CI

on:
  push:
    branches: [main, staging, "claude/**"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# Cancel superseded runs on PRs and feature branches; never on main/staging,
# where every merged commit needs its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  db-check:
    name: DB migrations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generate migrations from schema, then fail if any new files appear.
      # This catches schema changes that were committed without running db:generate.
      - run: DATABASE_URL=postgres://ignored pnpm db:generate
      - run: git diff --exit-code lib/db/migrations

  codegen-check:
    name: Codegen up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerate from openapi.yaml, then fail if generated files differ.
      # This catches spec changes committed without running pnpm codegen.
      - run: pnpm codegen
      - run: git diff --exit-code lib/api-zod/src/index.ts lib/api-client-react/src/index.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage thresholds live in each package's vitest.config.ts; dropping below fails the job.
      - run: pnpm test:coverage

  knip:
    name: Unused code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unused files, exports and dependencies (config: knip.json). knip loads drizzle.config.ts,
      # which reads DATABASE_URL; nothing connects.
      - run: pnpm knip
        env:
          DATABASE_URL: postgres://ignored

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      # Known high or critical advisories in what ships (dependencies, not devDependencies), from
      # the lockfile; nothing is installed. A new advisory fails every branch until it's fixed or
      # waived with --ignore <GHSA id> in the deps:audit script (docs/DEPLOYMENTS.md).
      - run: pnpm deps:audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, db-check, codegen-check, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browsers are ~150MB: cache them per Playwright version (pinned via the lockfile).
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/e2e exec playwright install-deps chromium
      # Full stack: the real API on in-process Postgres behind both frontends (e2e/).
      - run: pnpm --filter @repo/e2e e2e
        env:
          CI: "true"
          # A Clerk *development* instance: the signed-in tests sign test users in through it.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      # A failed run's HTML report and traces (screenshots, DOM, network), for
      # `pnpm --filter @repo/e2e exec playwright show-report <unzipped folder>`. Private repos only:
      # traces hold the test users' Clerk session cookies, and a public repo's artifacts are public.
      - if: failure() && github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  tests-with-code:
    name: Tests with code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PRs into staging only: a promotion into main carries commits staging already checked.
      # Always runs and passes otherwise, so CI passed never sees it skipped.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # A package whose source changed needs test changes too, or a "Tests: none needed — <reason>"
      # line in the PR description (docs/TESTING.md). The description is fetched rather than taken
      # from the event, so editing it and re-running this job picks up the change.
      - name: Source changes come with tests
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          CHANGED_FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          PR_BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""')
          export CHANGED_FILES PR_BODY
          node lib/ci/src/bin/tests-with-code.ts

  promotion-source:
    name: Promotion source
    runs-on: ubuntu-latest
    steps:
      # main only receives promotions from staging (hotfixes go through staging too).
      # Always runs and passes outside PRs into main, so CI passed never sees it skipped.
      - name: PRs into main come from staging
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != staging ]; then
            echo "::error::PRs into main must come from staging (got '$HEAD'). Target staging instead."
            exit 1
          fi

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      [lint, typecheck, db-check, codegen-check, test, knip, audit, build, e2e, tests-with-code, promotion-source]
    # The one check branch rulesets require. It must run even when a job it
    # needs fails or is skipped: a *skipped* required check counts as passing.
    # So it always runs, and fails unless every needed job succeeded.
    if: ${{ always() }}
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed jobs: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A job CI passed needs did not succeed ($RESULTS)"
              exit 1
            fi
          done
